<div id="dropzone">
  <svg class="brand" aria-hidden="true"><use href="#upshot-icon"/></svg>
  <h1>sboardx reader</h1>
  <p>Open a .sboardx storyboard file</p>
  <label>Choose file <input type="file" accept=".sboardx" id="file-input"></label>
  <p style="color:var(--text-dim);font-size:11px">or drag and drop anywhere</p>
  <div id="samples"><p>or open a sample</p></div>
  <p style="font-size:11px"><a href="https://github.com/Upshot-Storyboard/sboardx">Format spec &amp; source</a></p>
</div>
<div id="drop-ring"></div>

<div id="app">
  <div id="hd">
    <svg class="brand" aria-hidden="true"><use href="#upshot-icon"/></svg>
    <div>
      <div id="proj-title">—</div>
      <div id="proj-sub">—</div>
    </div>
    <div class="hd-space"></div>
    <div class="hd-nav">
      <button id="prev-btn" title="Previous panel  (←)">‹</button>
      <button id="next-btn" title="Next panel  (→)">›</button>
    </div>
    <span id="timecode">00:00:00</span>
    <button id="play-btn" title="Play / Pause  (Space)">▶</button>
  </div>

  <div id="strip"></div>

  <div id="canvas-area">
    <div id="canvas-wrap"><div id="cam-content"></div></div>
  </div>

  <div id="meta">
    <div class="mf mf-info"><label>Scene</label><div class="v" id="m-scene">—</div></div>
    <div class="mf mf-info"><label>Panel</label><div class="v" id="m-code">—</div></div>
    <div class="mf mf-info"><label>Duration</label><div class="v" id="m-dur">—</div></div>
    <div class="mf mf-info"><label>Camera</label><div class="v" id="m-camera" style="font-size:12px">—</div></div>
    <div class="mf" id="mf-dialogue"><label>Dialogue</label><div class="note" id="m-dialogue"></div></div>
    <div class="mf" id="mf-note"><label>Note</label><div class="note" id="m-note"></div></div>
    <p class="meta-empty">No dialogue or notes for this panel.</p>
  </div>

  <div id="tl">
    <div id="tl-scroll">
      <div id="tl-inner">
        <div class="tl-scenes" id="tl-scenes"></div>
        <div class="tl-video" id="tl-video"></div>
        <div class="tl-audio" id="tl-audio"></div>
        <div id="ph"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';

// ── State ────────────────────────────────────────────────────────────────────

const S = {
  project: null, sequence: null,
  panels: [],          // [{id, meta, layers:[{id,name,visible,blend,opacity,art,image?}], svgText:Map, dispCode, scene}]
  imageUrls: null,     // Map images/<file> -> blob URL (raster layers)
  scenes: [],          // [{id, name, color, start, dur, count, kfs, synthetic}] in timeline order
  clips: [],           // audio clips enriched with blobUrl
  currentIdx: 0,
  playhead: 0, playing: false,
  playT0: 0, playH0: 0,
  totalDur: 0, pps: 80,
  activeAudio: [], audioTimers: [],
  raf: null,
};

// Scene colors, by scene index mod 5.
const SCENE_PALETTE = ['#2a6fdb', '#7a5af0', '#19b3a6', '#f0772e', '#e0455e'];

const READ_VERSIONS = ['1.0', '1.1', '1.2'];
const SVG_NS = 'http://www.w3.org/2000/svg';
const SBX_NS = 'https://sboardx.format/ns/1.0';
// Texture file limits and grammars (SPEC "Textured strokes (1.2)").
const CELL_SIZE_MIN = 64, CELL_SIZE_MAX = 1024;
const INT_MAX = 1048576;
const LINK_RE = /^[A-Za-z0-9_.-]+(?:\/[A-Za-z0-9_.-]+)*$/;
const ID_RE = /^[A-Za-z_][A-Za-z0-9_-]*$/;
const PAGE_NAME_RE = /^images\/[A-Za-z0-9_-]+\.png$/;
const ASCII_RE = /^[\x00-\x7f]*$/;
// Max composed texture size. iOS Safari caps canvases at 16 MP.
const COMPOSE_MAX_PIXELS = 16 * 1024 * 1024;
// Extra texels kept around a rect-less view, for the cubic filter's reach.
const COMPOSE_MARGIN = 2;
// Max page side.
const PAGE_MAX = 2048;

// ── Favicon ──────────────────────────────────────────────────────────────────
// Built from the inline #upshot-icon symbol so the artwork ships once.
{
  const sym = document.getElementById('upshot-icon');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${sym.getAttribute('viewBox')}">${sym.innerHTML}</svg>`;
  const href = 'data:image/svg+xml,' + encodeURIComponent(svg);
  for (const rel of ['icon', 'apple-touch-icon']) {
    const link = document.createElement('link');
    link.rel = rel; link.type = 'image/svg+xml'; link.href = href;
    document.head.appendChild(link);
  }
}

// ── Layout mode ──────────────────────────────────────────────────────────────
// body.compact mirrors the compact media queries, for swipe navigation.
const COMPACT_QUERIES = [
  matchMedia('(max-width: 720px) and (orientation: portrait)'),
  matchMedia('(max-height: 520px) and (orientation: landscape)'),
];
function syncCompact() {
  document.body.classList.toggle('compact', COMPACT_QUERIES.some(q => q.matches));
}
COMPACT_QUERIES.forEach(q => q.addEventListener('change', syncCompact));
syncCompact();

// ── Drop / file open ─────────────────────────────────────────────────────────

document.body.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
document.body.addEventListener('dragleave', () => document.body.classList.remove('dragging'));
document.body.addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('dragging');
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

// Optional samples.json next to this page:
// {"files": [{"file": "Demo.sboardx", "name": "Demo", "credit": "…"}]},
// paths relative to it. No manifest, no list.
(async () => {
  let files;
  try {
    const res = await fetch('samples.json', { cache: 'no-cache' });
    if (!res.ok) return;
    files = (await res.json()).files;
  } catch { return; }
  if (!Array.isArray(files) || !files.length) return;
  const box = document.getElementById('samples');
  for (const f of files) {
    if (!f || !f.file) continue;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = f.name || f.file;
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const label = btn.textContent; btn.textContent = 'Loading…';
      try {
        const res = await fetch(new URL(f.file, new URL('samples.json', document.baseURI)));
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        await loadFile(new File([await res.arrayBuffer()], f.file.split('/').pop()));
      } catch (err) {
        alert(`Could not open ${f.file}: ${err.message}`);
      } finally {
        btn.disabled = false; btn.textContent = label;
      }
    });
    box.appendChild(btn);
    if (f.credit) {
      const c = document.createElement('div');
      c.className = 'credit'; c.textContent = f.credit;
      box.appendChild(c);
    }
  }
  box.classList.add('on');
})();

// ── Load project ─────────────────────────────────────────────────────────────

async function loadFile(file) {
  let zip;
  try { zip = await JSZip.loadAsync(file); }
  catch(e) { alert('Could not open file: ' + e.message); return; }

  S.project  = JSON.parse(await zip.file('project.json').async('string'));
  S.sequence = JSON.parse(await zip.file('sequence.json').async('string'));

  // Reads 1.0 to 1.2. Paths are DOM-imported as is, so sboardx:* attributes
  // mostly don't matter here. Exceptions: tiled texture markers on a
  // <pattern>, and sboardx:rgba as a pattern fill's fallback. A 1.1 pencil
  // layer is a hidden source plus visible derived copies, so honouring
  // `visible` is enough.
  const version = S.project.sboardx;
  if (Object.prototype.hasOwnProperty.call(S.project, 'x-the-storyboard-app')) {
    alert('This archive was written by a pre-release build of the app (its project.json ' +
          'carries "x-the-storyboard-app"). Re-export it from a current app.');
    return;
  }
  if (!READ_VERSIONS.includes(version)) {
    const m = /^(\d+)\.(\d+)$/.exec(typeof version === 'string' ? version : '');
    const newer = m && (+m[1] > 1 || (+m[1] === 1 && +m[2] > 2));
    alert(newer
      ? `This archive uses sboardx ${version}, newer than this reader (1.0 to 1.2). ` +
        'Open it in the latest reader.'
      : `This archive uses sboardx format "${version || 'unknown'}"; ` +
        'this reader reads 1.0, 1.1 and 1.2.');
    return;
  }

  // Load panels
  S.panels = [];
  S.warnings = [];
  S.imageUrls = new Map();   // images/<file> -> blob URL (deduped across layers)
  S.textures = new Map();    // `${panelID}/${layerID}` -> composed texture
  const parser = new DOMParser();
  for (const id of S.sequence.panels) {
    const meta   = JSON.parse(await zip.file(`panels/${id}/panel.json`).async('string'));
    const layers = JSON.parse(await zip.file(`panels/${id}/layers.json`).async('string'));
    const svgText = new Map();
    for (const layer of layers.layers) {
      const path = `panels/${id}/${layer.art}`;
      const entry = zip.file(path);
      if (entry) {
        const text = await entry.async('string');
        svgText.set(layer.id, text);
        let doc = null;
        const parsed = () => doc || (doc = parser.parseFromString(text, 'image/svg+xml'));
        // 1.1 textures: load each pattern's atlas image into a blob URL.
        if (text.includes('<pattern')) await loadPatternImages(zip, parsed(), path);
        // 1.2 textures: compose now, applied in compositeSVG.
        if (!layer.image && Object.prototype.hasOwnProperty.call(layer, 'texture')) {
          // The text rule needs the raw text, BOM included.
          const raw = new TextDecoder('utf-8', { ignoreBOM: true }).decode(await entry.async('uint8array'));
          const tex = await loadTexture(zip, `panels/${id}/`, layer.texture, raw,
                                        `panels/${id}/layers.json layer ${layer.id}`);
          if (tex) S.textures.set(`${id}/${layer.id}`, tex);
        }
      }
      // Raster layer image, once per file.
      if (layer.image && layer.image.file && !S.imageUrls.has(layer.image.file)) {
        const imgEntry = zip.file(layer.image.file);
        if (imgEntry) {
          const buf = await imgEntry.async('arraybuffer');
          S.imageUrls.set(layer.image.file,
            URL.createObjectURL(new Blob([buf], { type: imageMimeFor(layer.image.file) })));
        }
      }
    }
    S.panels.push({ id, meta, layers: layers.layers, svgText });
  }

  // Audio. Optional `track` per clip (default 0) and root `tracks` [{muted}]
  // (default: one unmuted track).
  S.clips = [];
  S.tracks = [{ muted: false }];
  const clipsFile = zip.file('audio/clips.json');
  if (clipsFile) {
    const clipsData = JSON.parse(await clipsFile.async('string'));
    if (Array.isArray(clipsData.tracks) && clipsData.tracks.length) {
      S.tracks = clipsData.tracks;
    }
    for (const clip of clipsData.clips) {
      let blobUrl = null;
      if (clip.file) {
        const entry = zip.file(`audio/${clip.file}`);
        if (entry) {
          const buf = await entry.async('arraybuffer');
          const mime = mimeFor(clip.file);
          blobUrl = URL.createObjectURL(new Blob([buf], { type: mime }));
        }
      }
      S.clips.push({ ...clip, blobUrl });
    }
  }

  S.totalDur = S.panels.reduce((a, p) => a + p.meta.dur, 0);
  S.currentIdx = 0;
  S.playhead = 0;

  // Show #app before building the UI. renderPanel sizes from clientWidth,
  // which is 0 while it's display:none.
  document.getElementById('dropzone').style.display = 'none';
  document.getElementById('app').classList.add('on');
  buildScenes();
  buildUI();
}

// Re-fit the canvas whenever its area changes (resize, rotation, layout
// switch, iframe resize).
{
  const refit = () => { if (S.panels.length) renderPanel(S.currentIdx); };
  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(refit).observe(document.getElementById('canvas-area'));
  } else {
    window.addEventListener('resize', refit);
  }
}

// ── Scenes ───────────────────────────────────────────────────────────────────
//
// Scenes group contiguous panels and carry the camera keyframes
// {t, z, cx, cy, rot}, t local to the scene. A file without scenes gets one
// synthetic scene (no camera, not drawn) so there's a single code path.
function buildScenes() {
  const raw = (S.sequence.scenes || []).filter(sc => sc && Array.isArray(sc.panels));
  const byPanel = new Map();
  raw.forEach(sc => sc.panels.forEach(pid => byPanel.set(pid, sc)));

  // One scene per contiguous run. A panel no scene lists joins the previous
  // panel's scene (or the first scene, for the first panel).
  S.scenes = [];
  let t = 0;
  let prevRaw;
  let built = null;
  let first = true;
  for (const panel of S.panels) {
    const fallback = first ? (raw[0] || null) : prevRaw;
    const rawScene = byPanel.has(panel.id) ? byPanel.get(panel.id) : fallback;
    if (first || rawScene !== prevRaw) {
      built = {
        id: rawScene ? rawScene.id : 'synthetic',
        name: rawScene ? (rawScene.name || 'Scene') : '',
        color: SCENE_PALETTE[(rawScene ? S.scenes.length : 0) % SCENE_PALETTE.length],
        start: t, dur: 0, count: 0,
        kfs: rawScene && rawScene.camera && Array.isArray(rawScene.camera.keyframes)
          ? rawScene.camera.keyframes.slice().sort((a, b) => a.t - b.t) : [],
        layerTracks: buildLayerTracks(rawScene),
        synthetic: !rawScene,
      };
      S.scenes.push(built);
    }
    prevRaw = rawScene;
    first = false;
    panel.sceneLocalStart = t - built.start;   // for static (thumbnail) poses
    built.dur += panel.meta.dur;
    built.count += 1;
    panel.scene = built;
    t += panel.meta.dur;
  }

  // Show `code` as is. Without one, fall back to "{scene}-{letter}".
  const counters = new Map();
  S.panels.forEach(p => {
    if (p.meta.code) { p.dispCode = p.meta.code; return; }
    if (p.scene && !p.scene.synthetic) {
      const n = (counters.get(p.scene) || 0) + 1;
      counters.set(p.scene, n);
      const letter = String.fromCharCode(65 + ((n - 1) % 26));
      p.dispCode = `${S.scenes.indexOf(p.scene) + 1}-${letter}`;
    } else {
      p.dispCode = '';
    }
  });
}

// ── Camera move interpolation ────────────────────────────────────────────────
//
// Hold at both ends. In between: smoothstep, zoom lerped in log space, linear
// pan, shortest-arc rotation in degrees.
function wrapDeg(d) {
  let x = ((d + 180) % 360 + 360) % 360;
  return x - 180;
}

function camPoseAt(kfs, t) {
  if (!kfs.length) return null;
  const pose = k => ({ z: k.z, cx: k.cx, cy: k.cy, rot: k.rot || 0 });
  if (t <= kfs[0].t) return pose(kfs[0]);
  if (t >= kfs[kfs.length - 1].t) return pose(kfs[kfs.length - 1]);
  let i = 0;
  while (i + 2 < kfs.length && kfs[i + 1].t <= t) i++;
  const a = kfs[i], b = kfs[i + 1];
  const span = b.t - a.t;
  const raw = span > 1e-9 ? Math.max(0, Math.min(1, (t - a.t) / span)) : 1;
  const f = raw * raw * (3 - 2 * raw);
  return {
    z: Math.exp(Math.log(a.z) + (Math.log(b.z) - Math.log(a.z)) * f),
    cx: a.cx + (b.cx - a.cx) * f,
    cy: a.cy + (b.cy - a.cy) * f,
    rot: wrapDeg((a.rot || 0) + wrapDeg((b.rot || 0) - (a.rot || 0)) * f),
  };
}

// ── Layer animation ──────────────────────────────────────────────────────────
//
// `layer_tracks` match layers by name: kind "layer" by layer name, kind
// "group" by the layer's `group`. Same easing as the camera, scale lerped in
// log space. Unknown kinds are skipped.
function buildLayerTracks(rawScene) {
  if (!rawScene || !Array.isArray(rawScene.layer_tracks)) return [];
  const out = [];
  for (const tr of rawScene.layer_tracks) {
    if (!tr || typeof tr.name !== 'string' || !tr.name) continue;
    if (tr.kind !== 'layer' && tr.kind !== 'group') continue;
    const pivot = tr.pivot || {};
    out.push({
      name: tr.name,
      isGroup: tr.kind === 'group',
      px: Number(pivot.x) || 0,
      py: Number(pivot.y) || 0,
      kfs: (Array.isArray(tr.keyframes) ? tr.keyframes : [])
        .filter(k => k && typeof k.t === 'number')
        .slice().sort((a, b) => a.t - b.t),
    });
  }
  return out;
}

function layerPoseAt(kfs, t) {
  const pose = k => ({
    tx: k.tx || 0, ty: k.ty || 0,
    s: (typeof k.s === 'number' && k.s > 0) ? k.s : 1,
    rot: k.rot || 0,
    opacity: (typeof k.opacity === 'number') ? Math.max(0, Math.min(1, k.opacity)) : 1,
  });
  if (!kfs.length) return { tx: 0, ty: 0, s: 1, rot: 0, opacity: 1 };
  if (t <= kfs[0].t) return pose(kfs[0]);
  if (t >= kfs[kfs.length - 1].t) return pose(kfs[kfs.length - 1]);
  let i = 0;
  while (i + 2 < kfs.length && kfs[i + 1].t <= t) i++;
  const a = pose(kfs[i]), b = pose(kfs[i + 1]);
  const span = kfs[i + 1].t - kfs[i].t;
  const raw = span > 1e-9 ? Math.max(0, Math.min(1, (t - kfs[i].t) / span)) : 1;
  const f = raw * raw * (3 - 2 * raw);
  return {
    tx: a.tx + (b.tx - a.tx) * f,
    ty: a.ty + (b.ty - a.ty) * f,
    s: Math.exp(Math.log(a.s) + (Math.log(b.s) - Math.log(a.s)) * f),
    rot: wrapDeg(a.rot + wrapDeg(b.rot - a.rot) * f),
    opacity: a.opacity + (b.opacity - a.opacity) * f,
  };
}

// p' = c + T + S(s)·R(rot)·(p - c) as an SVG matrix().
function layerPoseMatrix(pose, px, py) {
  const r = pose.rot * Math.PI / 180;
  const a = pose.s * Math.cos(r), b = pose.s * Math.sin(r);
  const c = -b, d = a;
  const e = px + pose.tx - (a * px + c * py);
  const f = py + pose.ty - (b * px + d * py);
  return `matrix(${a.toFixed(6)} ${b.toFixed(6)} ${c.toFixed(6)} ${d.toFixed(6)} ${e.toFixed(4)} ${f.toFixed(4)})`;
}

// Own track applies first, then the group's. SVG applies the leftmost
// matrix last, so the group's goes first.
function poseLayerNode(el, layer, scene, t) {
  let transform = '';
  let opacity = 1;
  const own = scene.layerTracks.find(tr => !tr.isGroup && tr.name === layer.name);
  const grp = layer.group
    ? scene.layerTracks.find(tr => tr.isGroup && tr.name === layer.group) : null;
  if (grp) {
    const p = layerPoseAt(grp.kfs, t);
    transform += layerPoseMatrix(p, grp.px, grp.py);
    opacity *= p.opacity;
  }
  if (own) {
    const p = layerPoseAt(own.kfs, t);
    transform += (transform ? ' ' : '') + layerPoseMatrix(p, own.px, own.py);
    opacity *= p.opacity;
  }
  if (transform) el.setAttribute('transform', transform); else el.removeAttribute('transform');
  if (opacity !== 1) el.setAttribute('opacity', opacity.toFixed(4)); else el.removeAttribute('opacity');
}

// Re-pose the live layer wrappers at the playhead.
function applyLayerPoses() {
  const panel = S.animPanel;
  if (!panel || !S.animNodes || !panel.scene) return;
  const t = S.playhead - panel.scene.start;
  for (const { el, layer } of S.animNodes) poseLayerNode(el, layer, panel.scene, t);
}

// Camera at the playhead. cx/cy are world coords (origin at frame center).
// The CSS below is p' = S(z)·R(-rot)·(p - c), with origin c + (w/2, h/2)
// and translate -c, as percentages.
function applyCamera() {
  const el = document.getElementById('cam-content');
  const panel = S.panels[S.currentIdx];
  const scene = panel && panel.scene;
  const pose = scene ? camPoseAt(scene.kfs, S.playhead - scene.start) : null;
  applyLayerPoses();
  if (!pose) {
    el.style.transform = '';
    el.style.transformOrigin = '';
    return;
  }
  const w = S.project.canvas.width, h = S.project.canvas.height;
  el.style.transformOrigin =
    `${((pose.cx + w / 2) / w * 100).toFixed(4)}% ${((pose.cy + h / 2) / h * 100).toFixed(4)}%`;
  el.style.transform =
    `translate(${(-pose.cx / w * 100).toFixed(4)}%, ${(-pose.cy / h * 100).toFixed(4)}%) ` +
    `rotate(${(-pose.rot).toFixed(2)}deg) scale(${pose.z.toFixed(4)})`;
}

// "Push-in + pan · 100% → 155%" from a move's first/last keyframe.
function camSummary(kfs) {
  if (kfs.length < 2) return null;
  const a = kfs[0], b = kfs[kfs.length - 1];
  const dz = b.z - a.z;
  // A pan counts if it's over 2% of the frame width.
  const pan = Math.hypot(b.cx - a.cx, b.cy - a.cy) > 0.02 * S.project.canvas.width;
  const rot = Math.abs((b.rot || 0) - (a.rot || 0)) > 1;
  let m;
  if (Math.abs(dz) < 0.04) m = pan ? 'Pan' : (rot ? 'Rotate' : 'Hold');
  else { m = dz > 0 ? 'Push-in' : 'Pull-out'; if (pan) m += ' + pan'; }
  if (rot && (Math.abs(dz) >= 0.04 || pan)) m += ' + rotate';
  return `${m} · ${Math.round(a.z * 100)}% → ${Math.round(b.z * 100)}%`;
}

function mimeFor(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  return { mp3:'audio/mpeg', wav:'audio/wav', aiff:'audio/aiff',
           aif:'audio/aiff', m4a:'audio/mp4', flac:'audio/flac',
           ogg:'audio/ogg', caf:'audio/x-caf' }[ext] || 'audio/*';
}

function imageMimeFor(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  return { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg',
           gif:'image/gif', webp:'image/webp' }[ext] || 'image/*';
}

// ── Textured strokes (SPEC "Textured strokes (1.2)") ─────────────────────────
//
// At load, each layer's texture file is checked and its cells composed into
// one image: the whole atlas if it fits COMPOSE_MAX_PIXELS, else one image
// per path. Pages are decoded one at a time. Damage is a header warning and
// the path just draws its flat fallback.
//
// compositeSVG then gives each textured path a 1.1-style single-image
// <pattern> over that image. Never one image per cell: browsers show seams.
//
// 1.1 single-image patterns draw natively. A tiled texture pattern is damage
// and draws flat in its sboardx:rgba colour. Other patterns draw flat.
//
// Shared drawings aren't drawn (the holder layer carries their art and its
// own texture file), so their texture files aren't read.

// Something not drawn the way its writer meant.
function warn(msg) {
  console.warn('sboardx: ' + msg);
  S.warnings.push(msg);
}

// sboardx:* attribute, namespaced or by literal name.
function sbAttr(el, name) {
  return el.getAttributeNS(SBX_NS, name) || el.getAttribute('sboardx:' + name);
}

function imageHref(img) {
  return img.getAttribute('href') || img.getAttribute('xlink:href');
}

// "../../../images/x.png" (relative to the art SVG) -> "images/x.png".
function archiveImagePath(href) {
  const m = /^(?:\.\.\/)+(images\/.+)$/.exec(href || '');
  return m ? m[1] : null;
}

// Integer in [lo, hi]. 64.0 counts as 64.
function isInt(v, lo, hi) {
  return typeof v === 'number' && v >= lo && v <= hi && v === Math.floor(v);
}

// [x, y, w, h], numbers, w > 0, h > 0.
function isRect(v) {
  return Array.isArray(v) && v.length === 4 && v.every(n => typeof n === 'number') && v[2] > 0 && v[3] > 0;
}

// The link grammar.
function linkOk(link) {
  return LINK_RE.test(link) && link.endsWith('.json') && link.split('/').every(s => s !== '.' && s !== '..');
}

// Texture file bytes under the content rule -> {value} or {error}.
function parseTextureBytes(bytes) {
  let depth = 0, inString = false, escaped = false;
  for (let i = 0; i < bytes.length; i++) {
    const b = bytes[i];
    if (!(b === 9 || b === 10 || b === 13 || (b >= 0x20 && b <= 0x7e)))
      return { error: `is not ASCII (a BOM or a non-ASCII byte, 0x${b.toString(16)} at ${i})` };
    if (inString) {
      if (escaped) escaped = false;
      else if (b === 0x5c) escaped = true;
      else if (b === 0x22) inString = false;
    } else if (b === 0x22) {
      inString = true;
    } else if (b === 0x5b || b === 0x7b) {
      if (++depth > 64) return { error: 'is nested deeper than 64 (arrays and objects)' };
    } else if (b === 0x5d || b === 0x7d) {
      --depth;
    }
  }
  let text = '';
  for (let i = 0; i < bytes.length; i += 8192) text += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  let value;
  try { value = JSON.parse(text); } catch (e) { return { error: `is not JSON (${e.message})` }; }
  const stack = [value];
  while (stack.length) {
    const v = stack.pop();
    if (typeof v === 'number' && !Number.isFinite(v)) return { error: 'holds a number that is not finite' };
    if (typeof v === 'string' && !ASCII_RE.test(v)) return { error: 'holds a string that is not ASCII' };
    if (v && typeof v === 'object') {
      for (const k of Object.keys(v)) {
        if (!Array.isArray(v) && !ASCII_RE.test(k)) return { error: 'holds a key that is not ASCII' };
        stack.push(v[k]);
      }
    }
  }
  return { value };
}

// The id in fill="url(#id)", or null.
function fillRef(el) {
  const m = /^url\(\s*['"]?#([^'")\s]+)['"]?\s*\)/.exec((el.getAttribute('fill') || '').trim());
  return m ? m[1] : null;
}

// 'tiled' (damage), '1.1' (single image, see SPEC "Textured strokes in 1.1
// files") or 'other' (drawn flat).
function patternForm(pat) {
  if (sbAttr(pat, 'atlas-size') !== null || sbAttr(pat, 'tile-size') !== null) return 'tiled';
  for (const el of pat.getElementsByTagName('*')) if (sbAttr(el, 'cell') !== null) return 'tiled';
  const num = a => { const s = pat.getAttribute(a); return s !== null && s.trim() !== '' ? Number(s) : NaN; };
  const [x, y, w, h] = ['x', 'y', 'width', 'height'].map(num);
  const vb = (pat.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
  if (![x, y, w, h].every(Number.isFinite) || !(w > 0) || !(h > 0)) return 'other';
  if (vb.length !== 4 || !vb.every(Number.isFinite) || Math.round(vb[2]) < 1 || Math.round(vb[3]) < 1) return 'other';
  const img = pat.getElementsByTagNameNS(SVG_NS, 'image')[0];
  return img && archiveImagePath(imageHref(img)) ? '1.1' : 'other';
}

// Draw a path in its sboardx:rgba colour, or black.
function flatFill(path) {
  const v = (sbAttr(path, 'rgba') || '').trim().split(/\s+/).map(Number);
  if (v.length === 4 && v.every(Number.isFinite)) {
    const c = k => Math.round(Math.max(0, Math.min(1, v[k])) * 255);
    path.setAttribute('fill', `rgb(${c(0)}, ${c(1)}, ${c(2)})`);
    path.setAttribute('fill-opacity', String(Math.max(0, Math.min(1, v[3]))));
  } else {
    path.setAttribute('fill', 'black');
    path.removeAttribute('fill-opacity');
  }
}

// Patterns by id.
function patternsById(doc) {
  const byId = new Map();
  for (const pat of doc.getElementsByTagNameNS(SVG_NS, 'pattern')) {
    const id = pat.getAttribute('id');
    if (id && !byId.has(id)) byId.set(id, pat);
  }
  return byId;
}

// Load each used 1.1 atlas into a blob URL; warn once per tiled pattern.
async function loadPatternImages(zip, doc, where) {
  const byId = patternsById(doc);
  const used = new Set();
  for (const path of doc.getElementsByTagNameNS(SVG_NS, 'path')) {
    const pat = byId.get(fillRef(path));
    if (pat) used.add(pat);
  }
  for (const pat of used) {
    const form = patternForm(pat);
    const label = `${where} pattern ${pat.getAttribute('id')}`;
    if (form === 'tiled') {
      warn(`${label} uses an unsupported tiled texture pattern; its strokes are drawn in their flat colour`);
      continue;
    }
    if (form !== '1.1') continue;
    const file = archiveImagePath(imageHref(pat.getElementsByTagNameNS(SVG_NS, 'image')[0]));
    if (S.imageUrls.has(file)) continue;
    const atlasEntry = zip.file(file);
    if (!atlasEntry) { warn(`${label}: ${file} is missing from the archive`); continue; }
    const buf = await atlasEntry.async('arraybuffer');
    S.imageUrls.set(file, URL.createObjectURL(new Blob([buf], { type: imageMimeFor(file) })));
  }
}

// 1.1 patterns draw natively (viewBox rounded to whole texels, like Upshot).
// Any other pattern fill draws flat.
function resolvePatternFills(doc) {
  const byId = patternsById(doc);
  if (!byId.size) return;
  const forms = new Map();
  for (const path of doc.getElementsByTagNameNS(SVG_NS, 'path')) {
    const pat = byId.get(fillRef(path));
    if (!pat) continue;
    if (!forms.has(pat)) {
      const form = patternForm(pat);
      forms.set(pat, form);
      if (form === '1.1') {
        const vb = pat.getAttribute('viewBox').trim().split(/[\s,]+/).map(n => Math.round(Number(n)));
        pat.setAttribute('viewBox', vb.join(' '));
      }
    }
    if (forms.get(pat) !== '1.1') flatFill(path);
  }
}

// -> {name, value}, or null on link damage (paths draw flat).
async function readTextureFile(zip, base, link, where) {
  const flat = 'its paths are drawn in their flat colour';
  if (typeof link !== 'string') { warn(`${where}: texture ${JSON.stringify(link)} is not a string; ${flat}`); return null; }
  if (!linkOk(link)) { warn(`${where}: texture "${link}" breaks the link grammar; ${flat}`); return null; }
  const name = base + link;
  const entry = zip.file(name);
  if (!entry || entry.dir) { warn(`${where}: texture "${link}" names no entry (${name}); ${flat}`); return null; }
  const parsed = parseTextureBytes(await entry.async('uint8array'));
  if (parsed.error) { warn(`${name} ${parsed.error}; ${flat}`); return null; }
  return { name, value: parsed.value };
}

// Top-level checks -> the model, or {error} (texture damage).
function textureModel(t) {
  if (!t || typeof t !== 'object' || Array.isArray(t)) return { error: 'the top level is not an object' };
  const as = t.atlas_size;
  if (!Array.isArray(as) || as.length !== 2 || !isInt(as[0], 1, INT_MAX) || !isInt(as[1], 1, INT_MAX))
    return { error: `atlas_size ${JSON.stringify(as)} is not two integers from 1 to ${INT_MAX}` };
  const size = t.cell_size;
  if (!isInt(size, CELL_SIZE_MIN, CELL_SIZE_MAX) || (size & (size - 1)))
    return { error: `cell_size ${JSON.stringify(size)} is not a power of two from ${CELL_SIZE_MIN} to ${CELL_SIZE_MAX}` };
  const hasRect = Object.prototype.hasOwnProperty.call(t, 'rect');
  if (hasRect && !isRect(t.rect)) return { error: `rect ${JSON.stringify(t.rect)} is not [x, y, w, h] with w and h above 0` };
  if (!Array.isArray(t.pages) || t.pages.some(p => typeof p !== 'string')) return { error: 'pages is not an array of strings' };
  if (!Array.isArray(t.cells)) return { error: 'cells is not an array' };
  if (!Array.isArray(t.paths)) return { error: 'paths is not an array' };
  return { W: as[0], H: as[1], size, R: hasRect ? t.rect : null, pages: t.pages, cells: t.cells, paths: t.paths };
}

// Stored cells as {x, y, file, sx, sy} in texels. Bad or duplicate cells
// are dropped (transparent). Slot bounds are checked later, per page.
function textureCells(m, label) {
  const cols = Math.ceil(m.W / m.size), rows = Math.ceil(m.H / m.size);
  const byPlace = new Map(), twice = new Set();
  m.cells.forEach((c, i) => {
    if (!Array.isArray(c) || c.length !== 5 || !c.every(v => isInt(v, 0, INT_MAX)) ||
        c[0] >= cols || c[1] >= rows || c[2] >= m.pages.length) {
      warn(`${label}: cell ${i} ${JSON.stringify(c)} is not five integers [col < ${cols}, row < ${rows}, ` +
           `page < ${m.pages.length}, slot_col, slot_row ≤ ${INT_MAX}]; drawn transparent there`);
      return;
    }
    const key = `${c[0]} ${c[1]}`;
    if (byPlace.has(key)) twice.add(key); else byPlace.set(key, c);
  });
  for (const key of twice) {
    warn(`${label}: cell ${key} is listed twice; drawn transparent there`);
    byPlace.delete(key);
  }
  return [...byPlace.values()].map(c => ({
    x: c[0] * m.size, y: c[1] * m.size, file: m.pages[c[2]], page: c[2], sx: c[3] * m.size, sy: c[4] * m.size,
  }));
}

// Not \s, which also matches \v, \f and Unicode spaces.
function isArtSpace(c) { return c === ' ' || c === '\t' || c === '\n' || c === '\r'; }

// The art check, on text with the BOM kept. '' if fine, else why (art
// damage: the texture isn't applied).
function artSyntaxProblem(raw) {
  if (raw.includes('<!')) return "holds '<!' (a document type declaration, comment or CDATA section)";
  const q = raw.indexOf('<?');
  if (q < 0) return '';
  const declaration = q === 0 && raw.startsWith('<?xml') && isArtSpace(raw.charAt(5));
  if (!declaration || raw.indexOf('<?', 1) >= 0) return "holds '<?' other than in an XML declaration opening the file";
  return '';
}

// Path tags: `<path` + whitespace up to the next `>` (or the end).
function artPathTags(raw) {
  const out = [];
  let from = 0;
  for (;;) {
    const p = raw.indexOf('<path', from);
    if (p < 0) return out;
    if (p + 5 < raw.length && isArtSpace(raw.charAt(p + 5))) {
      const gt = raw.indexOf('>', p + 5), end = gt < 0 ? raw.length : gt + 1;
      out.push(raw.substring(p, end));
      from = end;
    } else from = p + 5;
  }
}

// Every ` id="X"` in the tag, even inside another value
// (`data-x=' id="t0"'` holds t0).
function idsHeld(tag) {
  const out = [];
  let p = 0;
  for (;;) {
    p = tag.indexOf('id="', p);
    if (p < 0) return out;
    const start = p + 4;
    if (p > 0 && isArtSpace(tag.charAt(p - 1))) {
      const end = tag.indexOf('"', start);
      if (end < 0) return out;
      const id = tag.substring(start, end);
      if (!out.includes(id)) out.push(id);
    }
    p = start;
  }
}

// The listed form (rule 4 of "The art SVG's syntax"). '' if the tag is in
// it, and `attrs` gets the attributes, else why. Pairs are read in order, so
// a value containing ` d="` isn't mistaken for an attribute.
function listedFormProblem(tag, attrs) {
  const notForm = 'not one self-closing tag of name="value" attributes';
  const n = tag.length;
  if (n < 7 || tag.charAt(n - 1) !== '>' || tag.charAt(n - 2) !== '/') return notForm;
  const nameStart = c => (c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z') || c === '_';
  const nameChar = c => nameStart(c) || (c >= '0' && c <= '9') || c === '.' || c === '-';
  const stop = n - 2, names = new Map();
  let i = 5;
  for (;;) {
    const sep = i;
    while (i < stop && isArtSpace(tag.charAt(i))) i++;
    if (i === stop) break;
    if (i === sep) return notForm;                     // no whitespace before the attribute
    const ns = i;
    if (!nameStart(tag.charAt(i))) return notForm;
    i++;
    while (i < stop && nameChar(tag.charAt(i))) i++;
    if (i < stop && tag.charAt(i) === ':') {
      i++;
      if (i >= stop || !nameStart(tag.charAt(i))) return notForm;
      i++;
      while (i < stop && nameChar(tag.charAt(i))) i++;
    }
    const name = tag.substring(ns, i);
    if (i + 1 >= stop || tag.charAt(i) !== '=' || tag.charAt(i + 1) !== '"') return notForm;
    i += 2;
    const vs = i;
    while (i < stop && tag.charAt(i) !== '"') {
      const c = tag.charAt(i);
      if (c === '<' || c === '>' || c === '&') return notForm;
      i++;
    }
    if (i >= stop) return notForm;                     // the value never closes before "/>"
    if (names.has(name)) return `it carries ${name} twice`;
    names.set(name, tag.substring(vs, i));
    i++;
    if (name === 'style' || name === 'transform' || name === 'xmlns' || name.startsWith('xmlns:')) return `it carries ${name}`;
  }
  if (!names.has('id') || !names.has('d')) return 'it lacks id or d';
  if (attrs) for (const [k, v] of names) attrs.set(k, v);
  return '';
}

// The path dialect (rule 5): M L Q C Z starting with M, whole argument
// groups of finite numbers, at least one drawn segment.
function pathDialectOk(d) {
  let i = 0;
  const n = d.length;
  const skip = () => { while (i < n && (isArtSpace(d.charAt(i)) || d.charAt(i) === ',')) i++; };
  const digit = k => k < n && d.charAt(k) >= '0' && d.charAt(k) <= '9';
  const num = () => {
    skip();
    let k = i, digits = 0;
    if (k < n && (d.charAt(k) === '+' || d.charAt(k) === '-')) k++;
    while (digit(k)) { k++; digits++; }
    if (k < n && d.charAt(k) === '.') {
      k++;
      while (digit(k)) { k++; digits++; }
    }
    if (!digits) return false;
    if (k < n && (d.charAt(k) === 'e' || d.charAt(k) === 'E')) {
      let x = k + 1;
      if (x < n && (d.charAt(x) === '+' || d.charAt(x) === '-')) x++;
      if (digit(x)) {
        while (digit(x)) x++;
        k = x;
      }
    }
    if (!Number.isFinite(Number(d.substring(i, k)))) return false;
    i = k;
    return true;
  };
  const pair = () => num() && num();
  const nextIsNumber = () => {
    skip();
    if (i >= n) return false;
    const c = d.charAt(i);
    return (c >= '0' && c <= '9') || c === '-' || c === '+' || c === '.';
  };
  // segs: segments in the current subpath, drawn: finished subpaths with any.
  let segs = 0, open = false, drawn = 0, first = true;
  const flush = () => { if (open && segs) drawn++; segs = 0; open = false; };
  for (;;) {
    skip();
    if (i >= n) break;
    const cmd = d.charAt(i++);
    if (first && cmd !== 'M') return false;
    first = false;
    if (cmd === 'M') {
      flush();
      if (!pair()) return false;
      open = true;
      while (nextIsNumber()) {                          // extra pairs after M are lines
        if (!pair()) return false;
        segs++;
      }
    } else if (cmd === 'L') {
      do { if (!pair()) return false; segs++; } while (nextIsNumber());
    } else if (cmd === 'Q') {
      do { if (!pair() || !pair()) return false; segs++; } while (nextIsNumber());
    } else if (cmd === 'C') {
      do { if (!pair() || !pair() || !pair()) return false; segs++; } while (nextIsNumber());
    } else if (cmd === 'Z' || cmd === 'z') {
      if (open) flush();
    } else return false;
  }
  flush();
  return drawn > 0;
}

// Usable path entries as {id, tag, view, rect}, found by the text rule
// ("How a reader finds a listed path"). `tag` is the index among the path
// tags, which matches getElementsByTagName('path') once the art check
// passed. Bad entries warn once and the path draws flat.
function texturePaths(m, raw, label) {
  const tags = artPathTags(raw), byId = new Map();
  tags.forEach((t, k) => {
    for (const id of idsHeld(t)) {
      if (!byId.has(id)) byId.set(id, []);
      byId.get(id).push(k);
    }
  });
  const told = new Set();
  const tell = msg => { if (!told.has(msg)) { told.add(msg); warn(msg); } };
  const listed = new Map();
  for (const e of m.paths) {
    if (e && typeof e === 'object' && typeof e.id === 'string') listed.set(e.id, (listed.get(e.id) || 0) + 1);
  }
  const out = [];
  m.paths.forEach((e, i) => {
    const where = `${label} paths[${i}]`;
    const flat = 'drawn as its SVG says';
    if (!e || typeof e !== 'object' || Array.isArray(e)) return tell(`${where} is not an object`);
    if (typeof e.id !== 'string' || !ID_RE.test(e.id))
      return tell(`${where}: id ${JSON.stringify(e.id)} does not match [A-Za-z_][A-Za-z0-9_-]*`);
    const at = `${label} path ${e.id}`;
    const v = e.view;
    if (!Array.isArray(v) || v.length !== 4 || !v.every(n => isInt(n, 0, INT_MAX)) || v[2] < 1 || v[3] < 1 ||
        v[0] + v[2] > m.W || v[1] + v[3] > m.H)
      return tell(`${at}: view ${JSON.stringify(v)} is not whole texels inside its ${m.W}×${m.H} atlas; ${flat}`);
    const hasRect = Object.prototype.hasOwnProperty.call(e, 'rect');
    if (hasRect && !isRect(e.rect)) return tell(`${at}: rect ${JSON.stringify(e.rect)} is not [x, y, w, h] with w and h above 0; ${flat}`);
    if (!hasRect && !m.R) return tell(`${at} has no rect and the texture has none; ${flat}`);
    if (listed.get(e.id) > 1) return tell(`${at} is listed by ${listed.get(e.id)} entries; ${flat}`);
    const holders = byId.get(e.id) || [];
    if (!holders.length) return tell(`${at}: no path tag holds id="${e.id}"; a texture was lost`);
    if (holders.length > 1) return tell(`${at}: ${holders.length} path tags hold id="${e.id}"; ${flat}`);
    const attrs = new Map(), form = listedFormProblem(tags[holders[0]], attrs);
    if (form) return tell(`${at}: its tag is not in the listed form (${form}); ${flat}`);
    if (!pathDialectOk(attrs.get('d'))) return tell(`${at}: its d is not in the path dialect; ${flat}`);
    // Raw attribute only: no style, no inheritance, no trimming.
    const fill = attrs.has('fill') ? attrs.get('fill') : '#000000';
    if (fill === 'none' || fill.startsWith('url(')) return tell(`${at}: its fill is ${fill}, not a colour; ${flat}`);
    out.push({ id: e.id, tag: holders[0], view: v, rect: hasRect ? e.rect : null });
  });
  return out;
}

// Read, check and compose one layer's texture.
// -> {specs: Map path tag index -> pattern spec}, or null.
async function loadTexture(zip, base, link, raw, where) {
  const file = await readTextureFile(zip, base, link, where);
  if (!file) return null;
  const label = file.name;
  const artWhy = artSyntaxProblem(raw);
  if (artWhy) { warn(`${where}: the art ${artWhy}; its texture file is not applied`); return null; }
  const m = textureModel(file.value);
  if (m.error) { warn(`${label}: ${m.error}; the paths it lists are drawn in their flat colour`); return null; }
  const entries = texturePaths(m, raw, label);
  const cells = textureCells(m, label);
  if (!entries.length) return null;
  const specs = new Map();
  // A pattern shows `view` over `rect`. Rect-less entries all share the
  // whole atlas over the texture's rect.
  const whole = m.R ? { x: m.R[0], y: m.R[1], w: m.R[2], h: m.R[3], vb: [0, 0, m.W, m.H] } : null;
  if (m.W * m.H <= COMPOSE_MAX_PIXELS) {
    const [img] = await composeMany(zip, m, [{ cells, label, rect: { x: 0, y: 0, w: m.W, h: m.H } }], label);
    if (img && img.damaged) return null;
    if (whole) whole.img = img;
    for (const e of entries) {
      specs.set(e.tag, e.rect ? { x: e.rect[0], y: e.rect[1], w: e.rect[2], h: e.rect[3], vb: e.view, img } : whole);
    }
    return { specs };
  }
  // Too big: one image per path, made of the whole cells its view touches.
  // With its own rect, only the view's cells (the next cells may belong to
  // other strokes). Rect-less, add COMPOSE_MARGIN for filtering.
  const targets = [];
  for (const e of entries) {
    const [ax, ay, aw, ah] = e.view;
    const margin = e.rect ? 0 : COMPOSE_MARGIN;
    const x0 = Math.max(0, ax - margin), y0 = Math.max(0, ay - margin);
    const x1 = Math.min(m.W, ax + aw + margin), y1 = Math.min(m.H, ay + ah + margin);
    const mine = cells.filter(c => c.x < x1 && c.x + m.size > x0 && c.y < y1 && c.y + m.size > y0);
    let rect = null;
    for (const c of mine) {
      const r = { x0: c.x, y0: c.y, x1: Math.min(c.x + m.size, m.W), y1: Math.min(c.y + m.size, m.H) };
      rect = rect ? { x0: Math.min(rect.x0, r.x0), y0: Math.min(rect.y0, r.y0),
                      x1: Math.max(rect.x1, r.x1), y1: Math.max(rect.y1, r.y1) } : r;
    }
    rect = rect ? { x: rect.x0, y: rect.y0, w: rect.x1 - rect.x0, h: rect.y1 - rect.y0 } : { x: x0, y: y0, w: 0, h: 0 };
    if (rect.w * rect.h > COMPOSE_MAX_PIXELS) {
      warn(`${label} path ${e.id}: its view is larger than this reader composes ` +
           `(${COMPOSE_MAX_PIXELS / 1048576} MP); drawn in its flat colour`);
      continue;
    }
    const spec = e.rect
      ? { x: e.rect[0], y: e.rect[1], w: e.rect[2], h: e.rect[3], vb: e.view }
      : { x: whole.x + ax * whole.w / m.W, y: whole.y + ay * whole.h / m.H,
          w: aw * whole.w / m.W, h: ah * whole.h / m.H, vb: e.view };
    targets.push({ cells: mine, label: `${label} path ${e.id}`, rect, spec, tag: e.tag });
  }
  const done = await composeMany(zip, m, targets, label);
  targets.forEach((t, i) => {
    if (done[i] && done[i].damaged) return;
    t.spec.img = done[i];
    specs.set(t.tag, t.spec);
  });
  return { specs };
}

// A page's size from its PNG header (signature, then IHDR's width and
// height), or null if it doesn't start like a PNG. Read before decoding so
// nothing bigger than a page is ever decoded.
function pngSize(buf) {
  const b = new Uint8Array(buf);
  const sig = [137, 80, 78, 71, 13, 10, 26, 10, 0, 0, 0, 13, 73, 72, 68, 82];   // signature, IHDR length and type
  if (b.length < 24 || sig.some((v, i) => b[i] !== v)) return null;
  const dv = new DataView(buf);
  return { w: dv.getUint32(16), h: dv.getUint32(20) };
}

// Decoded page, or null (warned, its cells go transparent). SPEC "Pages":
// a PNG this browser can decode, each side from 1 to PAGE_MAX.
async function decodePage(zip, file, label, count) {
  const lost = `its ${count} cell${count === 1 ? '' : 's'} drawn transparent`;
  if (!PAGE_NAME_RE.test(file)) { warn(`${label}: page "${file}" is not named images/<[A-Za-z0-9_-]+>.png; ${lost}`); return null; }
  const entry = zip.file(file);
  if (!entry || entry.dir) { warn(`${label}: page ${file} is missing; ${lost}`); return null; }
  const buf = await entry.async('arraybuffer');
  const dim = pngSize(buf);
  if (!dim) { warn(`${label}: page ${file} is not a PNG; ${lost}`); return null; }
  if (!(dim.w >= 1 && dim.w <= PAGE_MAX) || !(dim.h >= 1 && dim.h <= PAGE_MAX)) {
    warn(`${label}: page ${file} is ${dim.w}×${dim.h}: a side is not from 1 to ${PAGE_MAX}; ${lost}`);
    return null;
  }
  try {
    const bitmap = await createImageBitmap(new Blob([buf], { type: 'image/png' }));
    if (bitmap.width === dim.w && bitmap.height === dim.h) return { bitmap, w: dim.w, h: dim.h };
    bitmap.close();
  } catch {}
  warn(`${label}: page ${file} could not be decoded; ${lost}`);
  return null;
}

// Compose targets {cells, label, rect} from one texture's pages. Each gives
// {url, x, y, w, h} in atlas texels, null if no cells, or {damaged}.
// Each page is decoded once and released before the next, and a target's
// canvas only lives from its first page to its last. iOS Safari caps canvas
// memory and frees it lazily, so this keeps the peak low.
async function composeMany(zip, m, targets, where) {
  const users = new Map();                  // page index -> [{t, cells on it}]
  targets.forEach((t, i) => {
    t.index = i;
    const mine = new Map();
    for (const c of t.cells) {
      if (!mine.has(c.page)) mine.set(c.page, []);
      mine.get(c.page).push(c);
    }
    for (const [page, onPage] of mine) {
      if (!users.has(page)) users.set(page, []);
      users.get(page).push({ t, cells: onPage });
    }
  });
  const order = [...users.keys()].sort((a, b) => a - b);
  const firstAt = new Map(), lastAt = new Map();
  order.forEach((page, k) => {
    for (const u of users.get(page)) {
      if (!firstAt.has(u.t)) firstAt.set(u.t, k);
      lastAt.set(u.t, k);
    }
  });
  const results = new Array(targets.length).fill(null);
  const open = new Map();                   // target -> {cv, ctx}
  const finish = async t => {
    const o = open.get(t);
    open.delete(t);
    if (!o) return;
    const blob = await new Promise(res => o.cv.toBlob(res, 'image/png'));
    o.cv.width = o.cv.height = 0;
    if (!blob) {
      warn(`${t.label}: the browser could not compose a ${t.rect.w}×${t.rect.h} texture; drawn in the flat colour`);
      results[t.index] = { damaged: true };
      return;
    }
    results[t.index] = { url: URL.createObjectURL(blob), x: t.rect.x, y: t.rect.y, w: t.rect.w, h: t.rect.h };
  };
  const size = m.size;
  for (let k = 0; k < order.length; k++) {
    const pageIndex = order[k], file = m.pages[pageIndex];
    for (const t of targets) {
      if (firstAt.get(t) !== k) continue;
      const cv = document.createElement('canvas');
      cv.width = t.rect.w; cv.height = t.rect.h;
      const ctx = cv.getContext('2d');
      if (!ctx) {
        cv.width = cv.height = 0;
        warn(`${t.label}: the browser could not allocate a ${t.rect.w}×${t.rect.h} texture; drawn in the flat colour`);
        results[t.index] = { damaged: true };
        continue;
      }
      ctx.imageSmoothingEnabled = false;
      open.set(t, { cv, ctx });
    }
    const onPage = users.get(pageIndex);
    const count = new Set(onPage.flatMap(u => u.cells.map(c => `${c.x},${c.y}`))).size;
    const page = await decodePage(zip, file, where, count);
    if (page) {
      const outside = new Set();
      for (const { t, cells } of onPage) {
        const o = open.get(t);
        for (const c of cells) {
          if (c.sx + size > page.w || c.sy + size > page.h) outside.add(`${c.x / size} ${c.y / size}`);
          else if (o) o.ctx.drawImage(page.bitmap, c.sx, c.sy, size, size, c.x - t.rect.x, c.y - t.rect.y, size, size);
        }
      }
      for (const cell of outside) {
        warn(`${where}: cell ${cell}'s slot is not inside its ${page.w}×${page.h} page ${file}; drawn transparent there`);
      }
      page.bitmap.close();
    }
    for (const t of targets) {
      if (lastAt.get(t) === k) await finish(t);
    }
  }
  return results;
}

// Point each textured path's fill at a single-image <pattern> over its
// composed image. The <defs> goes inside the layer <g> so it gets imported
// with it. No image means an empty (transparent) pattern. The pattern
// repeats past its rect, but outlines stay inside, so it never shows.
function applyTextures(doc, tex) {
  if (!tex || !tex.specs.size) return;
  const host = doc.querySelector('g') || doc.documentElement;
  const defs = doc.createElementNS(SVG_NS, 'defs');
  host.insertBefore(defs, host.firstChild);
  const made = new Map();                   // spec -> pattern id
  // k-th <path> element == k-th path tag, since the art check passed.
  const paths = Array.from(doc.getElementsByTagName('path'));
  for (let k = 0; k < paths.length; k++) {
    const path = paths[k], spec = tex.specs.get(k);
    if (!spec || path.namespaceURI !== SVG_NS) continue;
    let id = made.get(spec);
    if (!id) {
      id = `sbxtex-${++textureSeq}`;
      const pat = doc.createElementNS(SVG_NS, 'pattern');
      pat.setAttribute('id', id);
      pat.setAttribute('patternUnits', 'userSpaceOnUse');
      pat.setAttribute('x', String(spec.x)); pat.setAttribute('y', String(spec.y));
      pat.setAttribute('width', String(spec.w)); pat.setAttribute('height', String(spec.h));
      pat.setAttribute('viewBox', spec.vb.join(' '));
      pat.setAttribute('preserveAspectRatio', 'none');
      if (spec.img) {
        const img = doc.createElementNS(SVG_NS, 'image');
        img.setAttribute('href', spec.img.url);
        img.setAttribute('x', String(spec.img.x)); img.setAttribute('y', String(spec.img.y));
        img.setAttribute('width', String(spec.img.w)); img.setAttribute('height', String(spec.img.h));
        img.setAttribute('preserveAspectRatio', 'none');
        pat.appendChild(img);
      }
      defs.appendChild(pat);
      made.set(spec, id);
    }
    path.setAttribute('fill', `url(#${id})`);
    path.removeAttribute('fill-opacity');
  }
}

// ── Build UI ──────────────────────────────────────────────────────────────────

function buildUI() {
  const p = S.project;
  document.getElementById('proj-title').textContent = p.name;
  const res = p.canvas && p.canvas.resolution
    ? `${p.canvas.resolution.width}×${p.canvas.resolution.height}` : '';
  const sub = document.getElementById('proj-sub');
  sub.textContent =
    [p.episode, res, `${S.panels.length} panels`, fmtTime(S.totalDur)].filter(Boolean).join(' · ');
  // Warning count; details in the tooltip and the console.
  if (S.warnings.length) {
    const w = document.createElement('span');
    w.className = 'warn';
    w.textContent = ` · ${S.warnings.length} warning${S.warnings.length === 1 ? '' : 's'}`;
    w.title = S.warnings.join('\n');
    sub.appendChild(w);
  }

  buildStrip();
  buildTimeline();
  renderPanel(0);
  updatePlayhead();
}

function buildStrip() {
  const strip = document.getElementById('strip');
  strip.innerHTML = '';
  S.panels.forEach((panel, idx) => {
    const div = document.createElement('div');
    div.className = 'thumb' + (idx === 0 ? ' active' : '');
    div.dataset.idx = idx;

    const wrap = document.createElement('div');
    wrap.className = 'thumb-svg';
    const svg = compositeSVG(panel, true);
    wrap.appendChild(svg);
    div.appendChild(wrap);

    const info = document.createElement('div');
    info.className = 'thumb-info';
    info.innerHTML = `<span>${panel.dispCode}</span><span>${panel.meta.dur.toFixed(1)}s</span>`;
    div.appendChild(info);

    div.addEventListener('click', () => seekToPanel(idx));
    strip.appendChild(div);
  });
}

function buildTimeline() {
  const scenesRow = document.getElementById('tl-scenes');
  const video = document.getElementById('tl-video');
  const audio = document.getElementById('tl-audio');
  scenesRow.innerHTML = '';
  video.innerHTML = '';
  audio.innerHTML = '';

  const totalW = S.totalDur * S.pps;
  document.getElementById('tl-inner').style.width = Math.max(totalW + 100, 600) + 'px';

  // Scene bands and camera keyframe diamonds.
  for (const sc of S.scenes) {
    if (sc.synthetic) continue;
    const band = document.createElement('div');
    band.className = 'sblock';
    band.style.left = (sc.start * S.pps) + 'px';
    band.style.width = Math.max(sc.dur * S.pps - 3, 8) + 'px';
    band.style.background = sc.color + '2e';   // ~18% tint
    band.style.color = sc.color;
    band.innerHTML = `<span>${escapeHtml(sc.name.toUpperCase())}</span>` +
                     `<span class="sc-count">${sc.count}</span>`;
    band.title = camSummary(sc.kfs) || sc.name;
    scenesRow.appendChild(band);

    // Dashed line between keyframes, then the diamonds.
    for (let i = 0; i + 1 < sc.kfs.length; i++) {
      const seg = document.createElement('div');
      seg.className = 'kf-path';
      seg.style.left = ((sc.start + sc.kfs[i].t) * S.pps) + 'px';
      seg.style.width = Math.max(0, (sc.kfs[i + 1].t - sc.kfs[i].t) * S.pps) + 'px';
      seg.style.color = sc.color;
      scenesRow.appendChild(seg);
    }
    for (const kf of sc.kfs) {
      const d = document.createElement('div');
      d.className = 'kf-diamond';
      d.style.left = ((sc.start + kf.t) * S.pps) + 'px';
      d.style.background = sc.color;
      d.title = `${Math.round(kf.z * 100)}%` + (kf.rot ? ` · ${Math.round(kf.rot)}°` : '');
      scenesRow.appendChild(d);
    }
  }

  let t = 0;
  S.panels.forEach((panel, idx) => {
    const w = panel.meta.dur * S.pps;
    const el = document.createElement('div');
    el.className = 'pblock' + (idx === 0 ? ' active' : '');
    el.dataset.idx = idx;
    el.style.left = (t * S.pps) + 'px';
    el.style.width = Math.max(w - 3, 8) + 'px';
    el.textContent = panel.dispCode;
    if (panel.scene && !panel.scene.synthetic) {
      // Scene color on top, inset so the active border still shows.
      el.style.boxShadow = 'inset 0 2px 0 ' + panel.scene.color;
    }
    el.addEventListener('click', () => seekToPanel(idx));
    video.appendChild(el);
    t += panel.meta.dur;
  });

  // 36px per audio track. Height goes through --tl-h so compact landscape
  // can still drop the row.
  const nTracks = Math.max(1, S.tracks.length);
  audio.style.height = (nTracks * 36) + 'px';
  document.getElementById('app').style.setProperty('--tl-h', `${78 + nTracks * 36 + 8}px`);
  for (const clip of S.clips) {
    const ti = Math.min(Math.max(clip.track ?? 0, 0), nTracks - 1);
    const el = document.createElement('div');
    el.className = `ablock ak-${clip.kind}`;
    el.style.left  = (clip.start * S.pps) + 'px';
    el.style.top   = (ti * 36 + 4) + 'px';
    el.style.width = Math.max(clip.dur * S.pps - 2, 8) + 'px';
    if (S.tracks[ti] && S.tracks[ti].muted) el.style.opacity = '0.4';
    el.textContent = clip.name;
    el.title = `${clip.name}  ${fmtTime(clip.start)} – ${fmtTime(clip.start + clip.dur)}  trimIn: ${clip.trim_in?.toFixed(2) ?? 0}s`;
    audio.appendChild(el);
  }

  // Click to seek
  document.getElementById('tl-scroll').addEventListener('click', e => {
    const rect = e.currentTarget.getBoundingClientRect();
    const scrollX = e.currentTarget.scrollLeft;
    const x = e.clientX - rect.left + scrollX;
    seekTo(x / S.pps);
  });
}

// ── SVG composite ─────────────────────────────────────────────────────────────

// Page-wide id counters.
let blurFilterSeq = 0;
let gradientSeq = 0;
let textureSeq = 0;

// layers.json blend -> mix-blend-mode. `add` is plus-lighter.
function cssBlend(blend) {
  if (!blend || blend === 'normal') return '';
  return blend === 'add' ? 'plus-lighter' : blend;
}

// layers.json wins over the style baked into the art <g>. Toon Boom bakes
// no style at all.
function applyLayerStyle(el, layer) {
  if (typeof layer.opacity === 'number') el.style.opacity = layer.opacity === 100 ? '' : String(layer.opacity / 100);
  if (typeof layer.blend === 'string') el.style.mixBlendMode = cssBlend(layer.blend);
}

// Point 1.1 pattern images at their blob URLs.
function resolveAtlasHrefs(doc) {
  doc.querySelectorAll('pattern image').forEach(img => {
    const file = archiveImagePath(imageHref(img));
    if (!file) return;
    const url = S.imageUrls && S.imageUrls.get(file);
    if (url) { img.setAttribute('href', url); img.removeAttribute('xlink:href'); }
  });
}

// All panels share one HTML document, so ids like `g0` collide across
// layers. Rename gradients and patterns, and their references.
function uniquifyGradientIds(doc) {
  const grads = doc.querySelectorAll('linearGradient, radialGradient, pattern');
  if (!grads.length) return;
  const renames = new Map();
  grads.forEach(g => {
    const id = g.getAttribute('id');
    if (!id) return;
    const fresh = `${id}-sbx${++gradientSeq}`;
    renames.set(id, fresh);
    g.setAttribute('id', fresh);
  });
  const fixRef = (el, attr) => {
    const v = el.getAttribute(attr);
    if (!v) return;
    const m = /^url\(#([^)]+)\)/.exec(v.trim());
    if (m && renames.has(m[1])) el.setAttribute(attr, `url(#${renames.get(m[1])})`);
    else if (attr !== 'fill' && attr !== 'stroke' && v.startsWith('#') && renames.has(v.slice(1)))
      el.setAttribute(attr, `#${renames.get(v.slice(1))}`);   // href between gradients
  };
  doc.querySelectorAll('*').forEach(el => {
    fixRef(el, 'fill'); fixRef(el, 'stroke'); fixRef(el, 'href'); fixRef(el, 'xlink:href');
  });
}

function compositeSVG(panel, mini = false) {
  const w = S.project.canvas.width;
  const h = S.project.canvas.height;
  const NS = 'http://www.w3.org/2000/svg';

  // World coords, frame centered on the origin.
  const root = document.createElementNS(NS, 'svg');
  root.setAttribute('viewBox', `${-w / 2} ${-h / 2} ${w} ${h}`);
  root.setAttribute('xmlns', NS);
  if (mini) { root.setAttribute('width', '100%'); root.setAttribute('height', '100%'); }

  const bg = document.createElementNS(NS, 'rect');
  bg.setAttribute('x', String(-w / 2)); bg.setAttribute('y', String(-h / 2));
  bg.setAttribute('width', String(w)); bg.setAttribute('height', String(h));
  bg.setAttribute('fill', 'white');
  root.appendChild(bg);

  // Layer blur as a real SVG <filter>: WebKit ignores CSS blur() on SVG
  // content. The region spans a frame of overflow on each side.
  let defs = null;
  const blurFilterFor = (layer) => {
    if (!(layer.blur > 0)) return null;
    if (!defs) { defs = document.createElementNS(NS, 'defs'); root.appendChild(defs); }
    const id = `blur-${++blurFilterSeq}`;
    const f = document.createElementNS(NS, 'filter');
    f.setAttribute('id', id);
    f.setAttribute('filterUnits', 'userSpaceOnUse');
    f.setAttribute('x', String(-1.5 * w)); f.setAttribute('y', String(-1.5 * h));
    f.setAttribute('width', String(3 * w)); f.setAttribute('height', String(3 * h));
    const fe = document.createElementNS(NS, 'feGaussianBlur');
    fe.setAttribute('stdDeviation', String(layer.blur));
    f.appendChild(fe);
    defs.appendChild(f);
    return `url(#${id})`;
  };

  // Each layer gets a wrapper <g> that carries its animation pose.
  const anim = [];
  const attach = (node, layer) => {
    const wrap = document.createElementNS(NS, 'g');
    wrap.appendChild(node);
    root.appendChild(wrap);
    anim.push({ el: wrap, layer });
  };

  const parser = new DOMParser();
  for (const layer of panel.layers) {        // already bottom-to-top
    if (!layer.visible) continue;
    const blurUrl = blurFilterFor(layer);
    // Raster layer: the image centered on the origin, then the stored
    // affine as is. Its art SVG is empty, skip it.
    if (layer.image) {
      const url = S.imageUrls && S.imageUrls.get(layer.image.file);
      if (!url) continue;                    // missing from the archive
      const [a, b, c, d, tx, ty] = layer.image.transform;
      const img = document.createElementNS(NS, 'image');
      img.setAttribute('href', url);
      img.setAttribute('x', String(-layer.image.w / 2));
      img.setAttribute('y', String(-layer.image.h / 2));
      img.setAttribute('width', String(layer.image.w));
      img.setAttribute('height', String(layer.image.h));
      img.setAttribute('preserveAspectRatio', 'none');
      img.setAttribute('transform', `matrix(${a} ${b} ${c} ${d} ${tx} ${ty})`);
      applyLayerStyle(img, layer);
      if (blurUrl) img.style.filter = blurUrl;
      attach(img, layer);
      continue;
    }
    const svgStr = panel.svgText.get(layer.id);
    if (!svgStr) continue;
    const doc = parser.parseFromString(svgStr, 'image/svg+xml');
    uniquifyGradientIds(doc);
    resolvePatternFills(doc);
    applyTextures(doc, S.textures.get(`${panel.id}/${layer.id}`));
    resolveAtlasHrefs(doc);
    // Some writers put <defs> outside the layer <g>; carry them along.
    const rootDefs = Array.from(doc.documentElement.children)
      .filter(child => child.tagName === 'defs');
    const g = doc.querySelector('g');
    if (g) {
      const node = document.importNode(g, true);
      for (const d of rootDefs) node.insertBefore(document.importNode(d, true), node.firstChild);
      // Swap any baked CSS blur for the <filter>.
      applyLayerStyle(node, layer);
      if (blurUrl) node.style.filter = blurUrl;
      else if (node.style && node.style.filter) node.style.filter = '';
      attach(node, layer);
    } else {
      // No layer <g>: import the root's children in order.
      const wrap = document.createElementNS(NS, 'g');
      applyLayerStyle(wrap, layer);
      if (blurUrl) wrap.style.filter = blurUrl;
      for (const child of Array.from(doc.documentElement.children)) {
        if (child.tagName === 'parsererror') continue;
        // Upshot's invisible frame rect.
        if (child.tagName === 'rect' && child.getAttribute('fill') === 'none') continue;
        wrap.appendChild(document.importNode(child, true));
      }
      attach(wrap, layer);
    }
  }
  if (mini) {
    // Thumbnails: pose at the panel's first frame.
    if (panel.scene) {
      for (const { el, layer } of anim) poseLayerNode(el, layer, panel.scene, panel.sceneLocalStart || 0);
    }
  } else {
    S.animPanel = panel;
    S.animNodes = anim;
  }
  return root;
}

// ── Panel render ──────────────────────────────────────────────────────────────

function renderPanel(idx) {
  S.currentIdx = idx;
  const panel = S.panels[idx];

  // Canvas
  const wrap = document.getElementById('canvas-wrap');
  const w = S.project.canvas.width, h = S.project.canvas.height;
  wrap.style.aspectRatio = `${w} / ${h}`;
  // Fit, keeping aspect. Skip while the area is 0x0; the resize observer
  // calls again later.
  const area = wrap.parentElement;
  const cs = getComputedStyle(area);
  const aw = area.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = area.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom);
  if (aw > 0 && ah > 0) {
    const scale = Math.min(aw / w, ah / h);
    wrap.style.width  = Math.round(w * scale) + 'px';
    wrap.style.height = Math.round(h * scale) + 'px';
  }

  // #cam-content gets the camera transform.
  const cam = document.getElementById('cam-content');
  cam.innerHTML = '';
  cam.appendChild(compositeSVG(panel));
  applyCamera();

  // Meta
  const scene = panel.scene;
  document.getElementById('m-scene').textContent =
    scene && !scene.synthetic ? scene.name : '—';
  document.getElementById('m-code').textContent = panel.dispCode || '—';
  document.getElementById('m-dur').textContent  = panel.meta.dur.toFixed(2) + 's';
  document.getElementById('m-camera').textContent =
    (scene && camSummary(scene.kfs)) || '—';
  document.getElementById('m-dialogue').textContent = panel.meta.dialogue || '';
  document.getElementById('m-note').textContent = panel.meta.note || '';
  // The compact landscape rail hides these when empty.
  document.getElementById('mf-dialogue').classList.toggle('empty', !panel.meta.dialogue);
  document.getElementById('mf-note').classList.toggle('empty', !panel.meta.note);

  // Strip highlight
  document.querySelectorAll('.thumb').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.idx) === idx);
  });
  // Scroll thumbnail into view
  const thumb = document.querySelector(`.thumb[data-idx="${idx}"]`);
  if (thumb) thumb.scrollIntoView({ block: 'nearest' });

  // Timeline highlight
  document.querySelectorAll('.pblock').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.idx) === idx);
  });
}

// ── Playback ──────────────────────────────────────────────────────────────────

function togglePlay() {
  S.playing ? pause() : play();
}

function play() {
  if (S.playhead >= S.totalDur - 0.01) S.playhead = 0;
  S.playing = true;
  S.playT0 = performance.now();
  S.playH0 = S.playhead;
  document.getElementById('play-btn').textContent = '⏸';
  startAudio();
  S.raf = requestAnimationFrame(tick);
}

function pause() {
  S.playing = false;
  cancelAnimationFrame(S.raf);
  stopAudio();
  document.getElementById('play-btn').textContent = '▶';
}

function tick() {
  const elapsed = (performance.now() - S.playT0) / 1000;
  S.playhead = Math.min(S.totalDur, S.playH0 + elapsed);
  updatePlayhead();

  // Current panel from cumulative durations
  let t = 0;
  for (let i = 0; i < S.panels.length; i++) {
    if (S.playhead < t + S.panels[i].meta.dur || i === S.panels.length - 1) {
      if (S.currentIdx !== i) renderPanel(i);
      break;
    }
    t += S.panels[i].meta.dur;
  }

  applyCamera();

  if (S.playhead >= S.totalDur) { pause(); return; }
  S.raf = requestAnimationFrame(tick);
}

function seekTo(t) {
  const wasPlaying = S.playing;
  if (wasPlaying) pause();
  S.playhead = Math.max(0, Math.min(S.totalDur, t));
  updatePlayhead();

  // Snap to panel
  let acc = 0;
  for (let i = 0; i < S.panels.length; i++) {
    if (S.playhead < acc + S.panels[i].meta.dur || i === S.panels.length - 1) {
      if (S.currentIdx !== i) renderPanel(i);
      break;
    }
    acc += S.panels[i].meta.dur;
  }
  applyCamera();
  if (wasPlaying) play();
}

function seekToPanel(idx) {
  let t = 0;
  for (let i = 0; i < idx; i++) t += S.panels[i].meta.dur;
  seekTo(t);
}

function updatePlayhead() {
  document.getElementById('ph').style.left = (S.playhead * S.pps) + 'px';
  document.getElementById('timecode').textContent = fmtTimecode(S.playhead);
  // Scroll timeline to keep playhead visible
  const scroll = document.getElementById('tl-scroll');
  const x = S.playhead * S.pps;
  if (x < scroll.scrollLeft || x > scroll.scrollLeft + scroll.clientWidth - 40) {
    scroll.scrollLeft = Math.max(0, x - 80);
  }
}

// ── Audio ─────────────────────────────────────────────────────────────────────

function startAudio() {
  stopAudio();
  for (const clip of S.clips) {
    if (!clip.blobUrl) continue;
    // Muted track: skip. Each clip is its own Audio element.
    const track = S.tracks[Math.max(0, clip.track ?? 0)];
    if (track && track.muted) continue;
    const clipEnd = clip.start + clip.dur;
    if (clipEnd <= S.playhead) continue;

    const offsetInClip = Math.max(0, S.playhead - clip.start);
    const delay = Math.max(0, clip.start - S.playhead);
    const remaining = clip.dur - offsetInClip;
    const trimIn = clip.trim_in ?? 0;

    const start = () => {
      const a = new Audio(clip.blobUrl);
      a.volume = Math.max(0, Math.min(1, (clip.gain ?? 80) / 100));
      a.currentTime = trimIn + offsetInClip;
      a.play().catch(() => {});
      S.activeAudio.push(a);
      S.audioTimers.push(setTimeout(() => {
        a.pause();
        a.src = '';
        S.activeAudio = S.activeAudio.filter(x => x !== a);
      }, remaining * 1000));
    };

    if (delay < 0.05) {
      start();
    } else {
      S.audioTimers.push(setTimeout(start, delay * 1000));
    }
  }
}

function stopAudio() {
  S.activeAudio.forEach(a => { a.pause(); a.src = ''; });
  S.activeAudio = [];
  S.audioTimers.forEach(clearTimeout);
  S.audioTimers = [];
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function fmtTime(s) {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function fmtTimecode(s) {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60), f = Math.floor((s % 1) * 24);
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}:${String(f).padStart(2,'0')}`;
}

// ── Navigation: keyboard, header buttons, swipe ──────────────────────────────

function nextPanel() { seekToPanel(Math.min(S.currentIdx + 1, S.panels.length - 1)); }
function prevPanel() { seekToPanel(Math.max(S.currentIdx - 1, 0)); }

document.addEventListener('keydown', e => {
  if (!document.getElementById('app').classList.contains('on')) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); nextPanel(); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); prevPanel(); }
});

document.getElementById('play-btn').addEventListener('click', togglePlay);
document.getElementById('next-btn').addEventListener('click', nextPanel);
document.getElementById('prev-btn').addEventListener('click', prevPanel);

// Swipe the canvas to change panel in compact layouts.
{
  const area = document.getElementById('canvas-area');
  let sx = 0, sy = 0, tracking = false;
  area.addEventListener('pointerdown', e => {
    tracking = document.body.classList.contains('compact') && e.isPrimary;
    sx = e.clientX; sy = e.clientY;
  });
  area.addEventListener('pointerup', e => {
    if (!tracking || !S.panels.length) return;
    tracking = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
    if (dx < 0) nextPanel(); else prevPanel();
  });
  area.addEventListener('pointercancel', () => { tracking = false; });
}
</script>
</body>
