<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>sboardx reader</title>
  <!-- Same fonts as the Upshot website, system fonts when offline. The
       favicon is built by the script from #upshot-icon below. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Design tokens mirror the Upshot website (light theme only). */
    :root {
      color-scheme: light;
      --bg: #ffffff; --bg-panel: #f5f8fc; --bg-canvas: #edf1f6;
      --bg-bar: rgba(255,255,255,0.82);
      --line: rgba(13,26,44,0.1); --hairline: rgba(13,26,44,0.08);
      --input-border: rgba(13,26,44,0.18);
      --text: #0d1a2c; --text-body: #4a5a6e; --text-dim: #7a8798;
      --accent: #2a6fdb; --accent-hover: #1e56ae;
      --accent-tint: rgba(42,111,219,0.08); --accent-border: rgba(42,111,219,0.3);
      --font-ui: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-head: 'Space Grotesk', var(--font-ui);
      --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      --tl-h: 122px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: var(--font-ui); font-size: 13px; overflow: hidden; }
    button { font: inherit; cursor: pointer; }

    /* ── Drop zone ── */
    #dropzone { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; z-index: 100;
      padding: 24px; text-align: center; }
    #dropzone h1 { font-family: var(--font-head); font-size: 22px; font-weight: 700; }
    #dropzone p  { color: var(--text-body); }
    #dropzone label { padding: 11px 24px; background: var(--accent); border-radius: 10px;
      cursor: pointer; font-family: var(--font-head); font-weight: 700; font-size: 14px;
      color: #fff; transition: background .15s ease; }
    #dropzone label:hover { background: var(--accent-hover); }
    /* Samples listed from samples.json beside the reader (hidden when absent). */
    #samples { display: none; flex-direction: column; align-items: center; gap: 8px;
      margin-top: 10px; }
    #samples.on { display: flex; }
    #samples button { padding: 8px 16px; background: #fff; color: var(--text);
      border: 1px solid var(--input-border); border-radius: 8px; font-weight: 500;
      transition: background .15s ease, border-color .15s ease; }
    #samples button:hover { background: var(--bg-panel); border-color: var(--accent-border); }
    #samples button:disabled { opacity: 0.6; cursor: default; }
    #samples .credit { color: var(--text-dim); font-size: 11px; max-width: 420px;
      text-align: center; }
    #dropzone input { display: none; }
    #dropzone a { color: var(--accent); text-decoration: none; }
    #dropzone a:hover { color: var(--accent-hover); }
    #drop-ring { position: fixed; inset: 12px; border: 2px dashed var(--accent);
      border-radius: 14px; pointer-events: none; opacity: 0; transition: opacity .15s; }
    body.dragging #drop-ring { opacity: 1; }

    /* ── App shell ── */
    /* --tl-h is set from JS once the track count is known. */
    #app { display: none; height: 100%; grid-template-rows: 44px 1fr var(--tl-h);
      grid-template-columns: 148px 1fr 220px;
      grid-template-areas: "hd hd hd" "strip canvas meta" "tl tl tl"; }
    #app.on { display: grid; }

    /* Header */
    #hd { grid-area: hd; display: flex; align-items: center; gap: 10px;
      padding: 0 14px; background: var(--bg-bar);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--hairline); }
    .brand { width: 28px; height: 28px; flex-shrink: 0; display: block; }
    #dropzone .brand { width: 56px; height: 56px; }
    #proj-title { font-family: var(--font-head); font-weight: 600; font-size: 13px; }
    #proj-sub   { font-size: 10px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    #proj-sub .warn { color: #b45309; font-weight: 600; cursor: help; }
    .hd-space { flex: 1; }
    /* Prev / next: shown only in the compact layouts (no strip to click). */
    .hd-nav { display: none; gap: 4px; }
    .hd-nav button { width: 34px; height: 34px; border-radius: 8px;
      background: var(--accent-tint); border: 1px solid var(--accent-border);
      color: var(--accent); font-size: 20px; line-height: 1;
      display: flex; align-items: center; justify-content: center; padding-bottom: 3px; }
    .hd-nav button:hover { background: rgba(42,111,219,0.14); color: var(--accent-hover); }
    #timecode { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);
      min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
    #play-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--accent);
      border: none; color: #fff; font-size: 13px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s ease; }
    #play-btn:hover { background: var(--accent-hover); }

    /* Panel strip */
    #strip { grid-area: strip; overflow-y: auto; overflow-x: hidden;
      border-right: 1px solid var(--line); background: var(--bg-panel);
      padding: 6px; display: flex; flex-direction: column; gap: 5px; }
    .thumb { cursor: pointer; border-radius: 8px; overflow: hidden;
      border: 1px solid var(--line); background: #fff; flex-shrink: 0;
      transition: border-color .15s ease, box-shadow .15s ease; }
    .thumb:hover { border-color: var(--accent-border); }
    .thumb.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-border); }
    .thumb-svg { width: 100%; aspect-ratio: 16/9; display: block; background: #fff;
      border-bottom: 1px solid var(--hairline); }
    .thumb svg  { width: 100%; height: 100%; display: block; }
    .thumb-info { padding: 2px 5px 4px; display: flex; justify-content: space-between;
      font-size: 9px; font-family: var(--font-mono); color: var(--text-dim); }

    /* Canvas */
    #canvas-area { grid-area: canvas; display: flex; align-items: center;
      justify-content: center; padding: 16px; background: var(--bg-canvas); overflow: hidden; }
    /* White, since wide shots (z < 1) frame more than the paper rect. */
    #canvas-wrap { position: relative; max-width: 100%; max-height: 100%;
      background: #fff; border-radius: 8px; overflow: hidden;
      box-shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(13,26,44,0.10); }
    #canvas-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    /* Gets the camera transform. */
    #cam-content { position: absolute; inset: 0; will-change: transform; }
    /* Let art outside the frame show when the camera pans; #canvas-wrap
       still clips to the frame. Thumbnails keep the viewBox clip. */
    #cam-content svg { overflow: visible; }

    /* Meta */
    #meta { grid-area: meta; padding: 14px; border-left: 1px solid var(--line);
      background: var(--bg-panel); overflow-y: auto;
      display: flex; flex-direction: column; gap: 14px; }
    .mf label { font-family: var(--font-head); font-size: 10px; font-weight: 600;
      color: var(--text-dim); text-transform: uppercase;
      letter-spacing: .08em; display: block; margin-bottom: 3px; }
    .mf .v { font-size: 14px; font-weight: 500; }
    .mf .note { font-size: 12px; color: var(--text-body); line-height: 1.55;
      white-space: pre-wrap; word-break: break-word; }
    .meta-empty { display: none; font-size: 12px; color: var(--text-dim); }

    /* Timeline */
    #tl { grid-area: tl; border-top: 1px solid var(--line); background: var(--bg-panel);
      overflow: hidden; position: relative; }
    #tl-scroll { overflow-x: auto; overflow-y: hidden; height: 100%; cursor: crosshair;
      -webkit-overflow-scrolling: touch; touch-action: pan-x; }
    #tl-inner  { position: relative; height: 100%; }
    /* Scene bands and camera keyframes. Empty for files without scenes. */
    .tl-scenes { position: absolute; top: 0; left: 0; height: 22px; }
    .sblock { position: absolute; top: 3px; height: 16px; border-radius: 3px;
      font-size: 9px; font-weight: 600; letter-spacing: .04em; overflow: hidden;
      white-space: nowrap; display: flex; align-items: center; gap: 5px;
      padding: 0 6px; pointer-events: none; }
    .sblock .sc-count { opacity: .65; font-weight: 400; font-family: var(--font-mono); }
    .kf-diamond { position: absolute; top: 7px; width: 7px; height: 7px;
      transform: translateX(-50%) rotate(45deg); border-radius: 1px;
      pointer-events: none; z-index: 3; box-shadow: 0 0 0 1px var(--bg-panel); }
    .kf-path { position: absolute; top: 10px; height: 0; pointer-events: none;
      border-top: 1.5px dashed currentColor; opacity: .55; }
    .tl-video { position: absolute; top: 22px; height: 56px; left: 0; }
    .pblock { position: absolute; top: 8px; height: 40px; border-radius: 5px;
      background: #fff; border: 1px solid var(--line); overflow: hidden;
      font-size: 9px; font-family: var(--font-mono); color: var(--text-dim);
      display: flex; align-items: flex-end; padding: 0 5px 5px; cursor: pointer;
      transition: border-color .12s ease, background .12s ease; }
    .pblock:hover { border-color: var(--accent-border); }
    .pblock.active { border-color: var(--accent); color: var(--text); background: var(--accent-tint); }
    .tl-audio { position: absolute; top: 78px; left: 0; height: 36px; }
    .ablock { position: absolute; top: 4px; height: 28px; border-radius: 5px;
      font-size: 9px; font-family: var(--font-mono); overflow: hidden; white-space: nowrap;
      display: flex; align-items: center; padding: 0 6px; }
    .ak-music    { background: rgba(42,111,219,.14); border: 1px solid #2a6fdb; color: #1e56ae; }
    .ak-sfx      { background: rgba(16,185,129,.16); border: 1px solid #10b981; color: #047857; }
    .ak-dialogue { background: rgba(245,158,11,.18); border: 1px solid #f59e0b; color: #92400e; }
    #ph { position: absolute; top: 0; bottom: 0; width: 2px;
      background: var(--accent); pointer-events: none; z-index: 5; }
    #ph::before { content:''; position: absolute; top: 0; left: -4px;
      border: 5px solid transparent; border-top: 6px solid var(--accent); }

    /* ── Compact layouts (phones) ──
       Portrait: header, canvas, timeline. Landscape: header, canvas, notes
       rail. JS mirrors these queries onto body.compact. */
    @media (max-width: 720px) and (orientation: portrait) {
      #app.on { grid-template-columns: 1fr; grid-template-areas: "hd" "canvas" "tl"; }
      #strip, #meta, #proj-sub { display: none; }
      #hd { padding: 0 10px; gap: 8px; }
      #timecode { min-width: 0; }
      .hd-nav { display: flex; }
      #canvas-area { padding: 10px; touch-action: pan-y; }
    }
    @media (max-height: 520px) and (orientation: landscape) {
      #app.on { grid-template-rows: 44px 1fr; grid-template-columns: 1fr minmax(180px, 32%);
        grid-template-areas: "hd hd" "canvas meta"; }
      #strip, #tl, #proj-sub, .mf-info, #meta .mf.empty { display: none; }
      #hd { padding: 0 10px; gap: 8px; }
      #timecode { min-width: 0; }
      .hd-nav { display: flex; }
      #canvas-area { padding: 10px; touch-action: pan-y; }
      #meta { padding: 12px; gap: 12px; }
      #meta:has(#mf-dialogue.empty):has(#mf-note.empty) .meta-empty { display: block; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
